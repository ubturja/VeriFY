[project]
name = "verify"
version = "0.1.0"
description = "VeriFY shipping document verification pipeline and API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "python-multipart>=0.0.12",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
  "pdfplumber>=0.11.4",
  "pypdfium2>=4.30.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "rapidfuzz>=3.10.0",
  "charset-normalizer>=3.4.0",
  "pillow>=11.0.0",
  "pytesseract>=0.3.13",
  "python-dotenv>=1.0.1",
  "email-validator>=2.2.0",
  "sse-starlette>=2.1.3",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verify"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection pattern uses Depends(...) and Header(...) as
# default argument values.
"verify/api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
