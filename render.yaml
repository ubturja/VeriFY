services:
  - type: web
    name: verify-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: VERIFY_ENV
        value: cloud
      # Fernet key used to encrypt mailbox app passwords and mint session
      # tokens. Render generates a stable value the first time and reuses it
      # on later deploys, so sessions survive redeploys.
      - key: VERIFY_SECRET_KEY
        generateValue: true
      - key: VERIFY_API_HOST
        value: 0.0.0.0
      - key: VERIFY_BLOB_BACKEND
        value: local
      - key: VERIFY_QUEUE_BACKEND
        value: inmemory
      - key: VERIFY_LLM_PRIMARY
        value: gemini
      - key: VERIFY_LLM_FALLBACK
        value: groq
      - key: VERIFY_MAIL_SOURCE
        value: hackathon
      - key: VERIFY_STATE_PATH
        value: /tmp/verify-state.sqlite
      - key: VERIFY_LOCAL_BLOB_DIR
        value: /tmp/verify-blob
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_POLL_SECONDS
        value: 30
      - key: VERIFY_IMAP_AUTOPOLL
        value: true
      - key: VERIFY_CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional bootstrap mailbox. Leave both blank so every reviewer signs
      # in through the console instead of a hardcoded mailbox.
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_APP_PASSWORD
        sync: false

  - type: web
    name: verify-console
    runtime: static
    rootDir: console
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
